version: 2

models:
  - name: int_subscription_enriched
    description: >
      Subscription-level intermediate model that enriches each subscription
      with account attributes. The grain is one row per subscription.

    columns:
      - name: subscription_id
        description: Unique identifier for the subscription.
        tests:
          - not_null
          - unique

      - name: account_id
        description: Identifier of the account associated with the subscription.
        tests:
          - not_null
          - relationships:
              to: ref('stg_ravenstack__accounts')
              field: account_id

      - name: account_name
        description: Company or account name.

      - name: industry
        description: Industry associated with the account.

      - name: country
        description: Country associated with the account.

      - name: signup_date
        description: Date on which the account signed up.

      - name: plan_tier
        description: Subscription plan associated with the subscription.

      - name: mrr_amount
        description: Monthly recurring revenue associated with the subscription.

      - name: arr_amount
        description: Annual recurring revenue associated with the subscription.

  - name: int_usage_enriched
    description: >
      Usage-level intermediate model that enriches each recorded usage
      observation with subscription and account attributes.

    columns:
      - name: usage_id
        description: Identifier recorded for the usage observation.
        tests:
          - not_null

      - name: subscription_id
        description: Subscription associated with the usage observation.
        tests:
          - not_null
          - relationships:
              to: ref('stg_ravenstack__subscriptions')
              field: subscription_id

      - name: account_id
        description: Account associated with the usage observation.
        tests:
          - not_null
          - relationships:
              to: ref('stg_ravenstack__accounts')
              field: account_id

      - name: usage_date
        description: Date on which the usage observation occurred.
        tests:
          - not_null

      - name: feature_name
        description: Product feature associated with the usage observation.
        tests:
          - not_null

      - name: usage_count
        description: Number of uses recorded for the feature.

      - name: usage_duration_secs
        description: Usage duration recorded in seconds.

      - name: error_count
        description: Number of errors recorded for the usage observation.

      - name: is_beta_feature
        description: Indicates whether the feature was classified as beta.

      - name: plan_tier
        description: Subscription plan associated with the usage observation.

      - name: subscription_start_date
        description: Start date of the associated subscription.

      - name: subscription_end_date
        description: End date of the associated subscription.

  - name: int_account_monthly_usage
    description: >
      Monthly account-level usage summary. The grain is one row per account
      per calendar month with recorded usage.

    columns:
      - name: account_id
        description: Account associated with the monthly usage summary.
        tests:
          - not_null
          - relationships:
              to: ref('stg_ravenstack__accounts')
              field: account_id

      - name: usage_month
        description: Calendar month represented by the usage summary.
        tests:
          - not_null

      - name: usage_observation_count
        description: Number of usage observations recorded during the month.

      - name: active_usage_days
        description: Number of distinct days with recorded usage.

      - name: features_used
        description: Number of distinct features used during the month.

      - name: total_usage_count
        description: Total feature usage count during the month.

      - name: total_usage_duration_secs
        description: Total usage duration in seconds during the month.

      - name: total_error_count
        description: Total errors recorded during the month.

      - name: beta_usage_observation_count
        description: Number of beta-feature usage observations during the month.
    
  - name: int_account_support_summary
    description: >
      Account-level summary of support activity. The grain is one row per
      account with at least one support ticket.

    columns:
      - name: account_id
        description: Account associated with the support activity.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_ravenstack__accounts')
              field: account_id

      - name: ticket_count
        description: Total number of support tickets for the account.
        tests:
          - not_null

      - name: escalated_ticket_count
        description: Number of escalated support tickets for the account.
        tests:
          - not_null

      - name: open_ticket_count
        description: Number of support tickets that do not have a close timestamp.
        tests:
          - not_null

      - name: average_resolution_time_hours
        description: Average ticket resolution time in hours.

      - name: average_first_response_time_minutes
        description: Average time to first response in minutes.

      - name: average_satisfaction_score
        description: Average customer satisfaction score.

      - name: latest_ticket_date
        description: Most recent ticket submission date for the account.